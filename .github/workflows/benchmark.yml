name: Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Benchmarks
        run:
          npm run benchmark -- algorithms
